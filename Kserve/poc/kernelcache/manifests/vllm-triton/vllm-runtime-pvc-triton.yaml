apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    serving.kserve.io/server-type: vllmserver
  name: kserve-vllmserver-pvc-triton
spec:
  annotations:
    prometheus.kserve.io/path: /metrics
    prometheus.kserve.io/port: "8080"
  containers:
  - args:
    - --port=8080
    - --served-model-name={{.Name}}
    - --model=/mnt/models
    command:
    - python3
    - -m
    - vllm.entrypoints.openai.api_server
    env:
    - name: LMCACHE_USE_EXPERIMENTAL
      value: "True"
    - name: VLLM_CONFIG_ROOT
      value: /tmp
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: VLLM_CACHE_ROOT
      value: /tmp/vllm
    - name: TRITON_CACHE_DIR
      value: /tmp/triton
    - name: HOME
      value: /tmp
    - name: HF_HOME
      value: /tmp/hf
    image: vllm/vllm-openai:latest
    name: kserve-container
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /v1/models
        port: 8080
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 5
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: "1"
        memory: 2Gi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
    startupProbe:
      failureThreshold: 60
      httpGet:
        path: /v1/models
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      successThreshold: 1
      timeoutSeconds: 10
    volumeMounts:
    - mountPath: /dev/shm
      name: devshm
    - mountPath: /tmp/vllm
      name: vllm-cache
    - mountPath: /tmp/triton
      name: triton-cache
  hostIPC: false
  supportedModelFormats:
  - autoSelect: true
    name: vLLM
    priority: 1
    version: "1"
  volumes:
  - emptyDir:
      medium: Memory
    name: devshm
  - name: vllm-cache
    persistentVolumeClaim:
      claimName: cache-pvc
  - name: triton-cache
    persistentVolumeClaim:
      claimName: triton-cache-pvc